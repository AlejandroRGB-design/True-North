<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>True North - Panel de Usuario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="user-page-header">
        <section class="logo-section">
            <img src="Photos/vintage star.png" alt="True North Star" class="star-icon">
            <h1><a href="index.html" class="brand-link">True North</a></h1>
        </section>
    </header>

    <main>
        <div class="user-avatar-container">
            <div id="avatar-button" class="user-avatar-circle" style="--bg-image: url('Photos/user icon.png');"></div>
            <input type="file" id="avatar-input" accept="image/*" style="display: none;">

            <div class="category-counters">
                <div class="category-stat">Health Clicks <span id="clicks-health">0</span></div>
                <div class="category-stat">Skills Clicks <span id="clicks-skills">0</span></div>
                <div class="category-stat">Finance Clicks <span id="clicks-finance">0</span></div>
            </div>
        </div>

        <section class="liquid-glass-progress-container">
            <div class="liquid-glass-track">
                <div id="liquid-progress-fill" class="liquid-glass-fill">
                    <div class="liquid-glare"></div> </div>
            </div>
            
            <div class="progress-header">
                <span class="progress-title">Progress Bar</span>
                <span id="progress-percentage-text" class="progress-badge">0%</span>
            </div>
        </section>
    </main>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 1. Cargar contadores individuales desde localStorage (¡CLAVES CORREGIDAS!)
        const clicksHealth = parseInt(localStorage.getItem('tn_clicks_health') || '0');
        const clicksSkills = parseInt(localStorage.getItem('tn_clicks_skills') || '0'); // <-- ¡CORREGIDO AQUÍ! Ahora lee la clave correcta de skills
        const clicksFinance = parseInt(localStorage.getItem('tn_clicks_finance') || '0');

        // Asignar los valores a los cuadros independientes correspondientes
        document.getElementById('clicks-health').textContent = clicksHealth;
        document.getElementById('clicks-skills').textContent = clicksSkills;
        document.getElementById('clicks-finance').textContent = clicksFinance;

        // 2. Lógica de cálculo de la Barra de Progreso Mínima/Máxima
        const totalClicks = clicksHealth + clicksSkills + clicksFinance;
        const maxClicksTarget = 30; // Tu meta de clicks original
        
        // Calcular porcentaje asegurando que no pase del 100%
        let percentage = Math.min(Math.round((totalClicks / maxClicksTarget) * 100), 100);

        // 3. ACTUALIZACIÓN DE LA BARRA VISUAL (Diseño Premium Apple)
        const progressFill = document.getElementById('liquid-progress-fill');
        const percentageText = document.getElementById('progress-percentage-text');

        if (progressFill && percentageText) {
            // Animación fluida al cargar la página
            setTimeout(() => {
                progressFill.style.width = percentage + '%';
                percentageText.textContent = percentage + '%';
            }, 150);
        }

        // 4. Lógica de persistencia de la Foto de Perfil (Avatar)
        const avatarInput = document.getElementById('avatar-input');
        const avatarButton = document.getElementById('avatar-button');

        const savedAvatar = localStorage.getItem('user_avatar');
        if (savedAvatar && avatarButton) {
            avatarButton.style.setProperty('--bg-image', `url(${savedAvatar})`);
        }

        if (avatarButton && avatarInput) {
            avatarButton.addEventListener('click', function() {
                avatarInput.click();
            });

            avatarInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const base64Image = event.target.result;
                        avatarButton.style.setProperty('--bg-image', `url(${base64Image})`);
                        localStorage.setItem('user_avatar', base64Image);
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
    });
    </script>
</body>
</html>
